name: build

on:
  push:
    branches: [main]
    paths: ['src.zip', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: ソースを展開
        run: unzip -o src.zip -d src

      - name: Theos を準備
        run: |
          brew install ldid make dpkg xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: ビルド
        working-directory: src
        run: |
          chmod 755 layout/DEBIAN/postinst layout/DEBIAN/prerm
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          ls -la packages

      - name: Sileo 用リポジトリを作る
        run: |
          mkdir -p site/debs
          cp src/packages/*.deb site/debs/
          cd site
          dpkg-scanpackages -m debs /dev/null > Packages
          bzip2 -kf Packages
          gzip -kf Packages
          printf '%s\n' \
            'Origin: MemScan' 'Label: MemScan' 'Suite: stable' 'Version: 1.0' 'Codename: ios' \
            'Architectures: iphoneos-arm64' 'Components: main' 'Description: MemScan repo' > Release
          echo '<!doctype html><meta charset=utf-8><title>MemScan repo</title><p>Sileo / Zebra の「ソース」に、このページの URL を追加してください。</p>' > index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: deb をリリースに添付
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" src/packages/*.deb \
            --title "build ${{ github.run_number }}" --notes "iphoneos-arm64 (rootless)"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
